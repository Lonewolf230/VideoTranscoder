

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  workers:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: workers
    env_file:
      - ./workers/.env
    restart: always
    
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    ports:
      - "5173:80"
    env_file:
      - ./frontend/.env
